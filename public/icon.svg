<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#075E54" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background circle with safe zone padding -->
  <rect width="512" height="512" rx="128" fill="url(#waGrad)" />

  <!-- Chat Bubble -->
  <g filter="url(#shadow)">
    <path d="M256 96 C167.6 96 96 167.6 96 256 C96 288.5 105.7 318.7 122.4 344 L104 416 L178.6 396.4 C202.4 410.6 228.4 416 256 416 C344.4 416 416 344.4 416 256 C416 167.6 344.4 96 256 96 Z" fill="#ffffff" />
  </g>

  <!-- Soundwave / Microphone / Detective Paw icon inside bubble -->
  <!-- Microphone body -->
  <rect x="236" y="170" width="40" height="74" rx="20" fill="#075E54" />
  <!-- Arc around mic -->
  <path d="M214 220 C214 248 232 266 256 266 C280 266 298 248 298 220" fill="none" stroke="#075E54" stroke-width="12" stroke-linecap="round" />
  <!-- Mic stand -->
  <path d="M256 266 L256 298 M230 298 L282 298" fill="none" stroke="#075E54" stroke-width="12" stroke-linecap="round" />

  <!-- Detective Magnifier Badge at bottom-right of bubble -->
  <circle cx="316" cy="316" r="38" fill="#FFC107" stroke="#ffffff" stroke-width="6" />
  <circle cx="316" cy="316" r="26" fill="#FFF3CD" stroke="#B78103" stroke-width="5" />
  <line x1="335" y1="335" x2="355" y2="355" stroke="#795548" stroke-width="10" stroke-linecap="round" />
</svg>
